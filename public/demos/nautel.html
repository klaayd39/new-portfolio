<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nautel AUI Monitor</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
        background: #071018;
        color: #f8fafc;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 24px 16px 32px;
      }
      img { max-width: 100%; height: auto; border-radius: 12px; box-shadow: 0 20px 50px rgba(0,0,0,.45); }
      h1 { font-size: 1.25rem; margin: 16px 0 8px; text-align: center; }
      p { max-width: 42ch; text-align: center; color: #94a3b8; font-size: 0.95rem; line-height: 1.5; }
      a {
        margin-top: 20px;
        display: inline-flex;
        padding: 10px 18px;
        border-radius: 999px;
        background: #0891b2;
        color: #fff;
        text-decoration: none;
        font-weight: 600;
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <img src="/projects/nautel.png" width="960" alt="Nautel AUI monitoring capture" />
    <h1>Nautel AUI Monitor</h1>
    <p>Scheduled PrintWindow captures of the transmitter AUI — historical screenshots for remote-site diagnostics.</p>
    <a href="https://github.com/klaayd39/nautel-aui-monitor" target="_blank" rel="noopener noreferrer">View on GitHub</a>
  </body>
</html>
